<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
            text-align: center;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .content-wrapper {
                flex-direction: row;
            }

            .video-list {
                flex: 0 0 350px;
            }

            .player-wrapper {
                flex: 1;
            }
        }

        .video-list {
            display: grid;
            gap: 15px;
        }

        .video-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }

        .video-item:hover {
            background: #333;
        }

        .video-item.active {
            background: #0066cc;
        }

        .video-name {
            flex: 1;
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 16px;
        }

        .video-name:focus {
            outline: none;
            border-color: #0066cc;
        }

        .play-btn {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: #0052a3;
        }

        .play-btn.playing {
            background: #dc3545;
        }

        .play-btn.playing:hover {
            background: #c82333;
        }

        .player-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            transition: opacity 0.3s;
        }

        .player-container.hidden {
            opacity: 0;
            pointer-events: none;
            height: 0;
            overflow: hidden;
        }

        #player {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .control-btn {
            background: #444;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #555;
        }

        .control-btn.pause {
            background: #dc3545;
        }

        .control-btn.pause:hover {
            background: #c82333;
        }

        .control-btn.toggle {
            background: #0066cc;
        }

        .control-btn.toggle:hover {
            background: #0052a3;
        }

        .set-switch {
            background: #28a745;
        }

        .set-switch:hover {
            background: #218838;
        }

        .file-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            align-items: center;
        }

        .file-selector select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 16px;
            min-width: 200px;
        }

        .file-selector select:focus {
            outline: none;
            border-color: #0066cc;
        }

        .admin-link {
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-link:hover {
            color: #0066cc;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Video Player</h1>

        <div class="file-selector">
            <select id="fileSelect" onchange="loadSelectedFile()">
                <option value="">Select a playlist...</option>
            </select>
            <a href="admin.php" class="admin-link">Edit Playlists</a>
        </div>

        <div class="content-wrapper">
            <div class="video-list" id="videoList"></div>

            <div class="player-wrapper">
                <div class="controls">
                    <button class="control-btn pause" id="pauseBtn" onclick="togglePause()">Pause</button>
                    <button class="control-btn toggle" id="toggleBtn" onclick="toggleVideoVisibility()">Hide Video</button>
                    <button class="control-btn set-switch" id="setBtn" onclick="switchSet()">Switch to Set 2</button>
                </div>

                <div class="player-container">
                    <div id="player"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let videoSets = {};
        let player;
        let playerReady = false;
        let currentVideoIndex = null;
        let endTimeInterval = null;
        let isVideoVisible = true;
        let setKeys = [];
        let currentSetIndex = 0;
        let currentSet = null;
        let videos = [];
        let currentFile = null;

        // Load file list on startup
        async function loadFileList() {
            try {
                const response = await fetch('api.php?list');
                const data = await response.json();
                const select = document.getElementById('fileSelect');

                select.innerHTML = '<option value="">Select a playlist...</option>';

                data.files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    select.appendChild(option);
                });

                // Auto-select first file if available
                if (data.files.length > 0) {
                    select.value = data.files[0];
                    loadSelectedFile();
                }
            } catch (error) {
                console.error('Failed to load file list:', error);
            }
        }

        async function loadSelectedFile() {
            const select = document.getElementById('fileSelect');
            const filename = select.value;

            if (!filename) {
                videoSets = {};
                setKeys = [];
                videos = [];
                currentSet = null;
                renderVideoList();
                updateSetButton();
                return;
            }

            try {
                const response = await fetch(`api.php?file=${encodeURIComponent(filename)}`);
                if (!response.ok) throw new Error('File not found');

                videoSets = await response.json();
                currentFile = filename;
                setKeys = Object.keys(videoSets);
                currentSetIndex = 0;

                if (setKeys.length > 0) {
                    currentSet = setKeys[0];
                    videos = videoSets[currentSet];
                } else {
                    currentSet = null;
                    videos = [];
                }

                currentVideoIndex = null;
                renderVideoList();
                updateSetButton();
            } catch (error) {
                console.error('Failed to load file:', error);
            }
        }

        // Load YouTube IFrame API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'playsinline': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            playerReady = true;
            loadFileList();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                startEndTimeCheck();
            } else {
                stopEndTimeCheck();
            }
            renderVideoList();
        }

        function startEndTimeCheck() {
            stopEndTimeCheck();

            if (currentVideoIndex !== null && videos[currentVideoIndex].endTime !== null) {
                endTimeInterval = setInterval(() => {
                    const currentTime = player.getCurrentTime();
                    const endTime = videos[currentVideoIndex].endTime;

                    if (currentTime >= endTime) {
                        player.pauseVideo();
                        stopEndTimeCheck();
                    }
                }, 100);
            }
        }

        function stopEndTimeCheck() {
            if (endTimeInterval) {
                clearInterval(endTimeInterval);
                endTimeInterval = null;
            }
        }

        function updateSetButton() {
            const setBtn = document.getElementById('setBtn');
            if (setKeys.length <= 1) {
                setBtn.style.display = 'none';
            } else {
                setBtn.style.display = '';
                const nextSetIndex = (currentSetIndex + 1) % setKeys.length;
                const nextSetName = setKeys[nextSetIndex];
                setBtn.textContent = `Switch to ${nextSetName}`;
            }
        }

        function renderVideoList() {
            const listContainer = document.getElementById('videoList');
            listContainer.innerHTML = '';

            if (!videos || videos.length === 0) {
                listContainer.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">No videos in this set</p>';
                return;
            }

            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                if (index === currentVideoIndex) {
                    item.classList.add('active');
                }

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'video-name';
                input.value = video.name;
                input.addEventListener('change', (e) => {
                    videos[index].name = e.target.value;
                });

                const button = document.createElement('button');
                button.className = 'play-btn';
                
                const isCurrentVideo = index === currentVideoIndex;
                const isPlaying = isCurrentVideo && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;
                
                if (isPlaying) {
                    button.classList.add('playing');
                    button.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg>';
                } else {
                    button.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2 L13 8 L3 14 Z"/></svg>';
                }
                
                button.addEventListener('click', () => {
                    if (isCurrentVideo && player.getPlayerState() === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                    } else {
                        playVideo(index);
                    }
                });

                item.appendChild(input);
                item.appendChild(button);
                listContainer.appendChild(item);
            });
        }

        function playVideo(index) {
            currentVideoIndex = index;
            const video = videos[index];
            
            player.loadVideoById({
                videoId: video.id,
                startSeconds: video.startTime
            });
            
            renderVideoList();
        }

        function togglePause() {
            if (player && player.getPlayerState) {
                const state = player.getPlayerState();
                
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                    document.getElementById('pauseBtn').textContent = 'Resume';
                } else if (state === YT.PlayerState.PAUSED) {
                    player.playVideo();
                    document.getElementById('pauseBtn').textContent = 'Pause';
                }
            }
        }

        function toggleVideoVisibility() {
            const playerContainer = document.querySelector('.player-container');
            const toggleBtn = document.getElementById('toggleBtn');
            
            isVideoVisible = !isVideoVisible;
            
            if (isVideoVisible) {
                playerContainer.classList.remove('hidden');
                toggleBtn.textContent = 'Hide Video';
            } else {
                playerContainer.classList.add('hidden');
                toggleBtn.textContent = 'Show Video';
            }
        }

        function switchSet() {
            if (setKeys.length <= 1) return;

            // Cycle to next set
            currentSetIndex = (currentSetIndex + 1) % setKeys.length;
            currentSet = setKeys[currentSetIndex];
            videos = videoSets[currentSet];

            // Reset current video and stop playback
            currentVideoIndex = null;
            stopEndTimeCheck();
            if (playerReady) player.stopVideo();

            // Update button and re-render
            updateSetButton();
            renderVideoList();
        }
    </script>
</body>
</html>
